schema_version: 1
protocol_version: vector-database-v4
seed: 42
# Smoke fixtures are diagnostics, not a reviewed authoritative search space.
workloads:
  smoke:
    - {name: smoke-1k-d384, size: 1000, dimension: 384, queries: 50, concurrency: [1]}
  development: []
  validation: []
  locked: []
candidates:
  smoke:
    - {id: 'chroma|smoke-hnsw', database: chroma, settings: {m: 16, ef_construction: 100, ef_search: 64}}
    - {id: 'qdrant|smoke-hnsw', database: qdrant, settings: {m: 16, ef_construction: 100, ef_search: 64}}
    - {id: 'weaviate|smoke-hnsw', database: weaviate, settings: {m: 16, ef_construction: 100, ef_search: 64}}
    - {id: 'pgvector|smoke-hnsw', database: pgvector, settings: {m: 16, ef_construction: 100, ef_search: 64}}
  development: []
smoke_hnsw: {m: 16, ef_construction: 100, ef_search: 64}
shortlist_limit: 3
synthetic:
  centroid_count: 128
  records_per_document: 5
  cluster_noise: 0.08
  near_duplicate_fraction: 0.05
  near_duplicate_noise: 0.001
  query_noise: 0.01
  metadata_divisors: {scope_50: 2, scope_10: 10, scope_1: 100, scope_01: 1000}
conformance:
  size: 40
  dimension_query_count: 4
  seed: 7
  search_limit: 10
  compound_filters: [scope_50, scope_10]
  empty_filter: scope_1
adapters:
  upsert_batch_sizes: {chroma: 2000, qdrant: 2000, weaviate: 200, pgvector: 2000}
  index_verification_limit: 10
  qdrant_full_scan_threshold: 10
  qdrant_indexing_threshold: 1
  request_timeout_seconds: 120
  connection_pool_limit: 64
  index_readiness_timeout_seconds: 120
  index_readiness_poll_seconds: 0.25
  docker_monitor_interval_seconds: 0.25
  docker_stats_timeout_seconds: 10
  docker_storage_timeout_seconds: 30
  docker_helper_timeout_seconds: 60
  docker_restart_timeout_seconds: 120
measurement:
  monitor_storage: true
  monitor_server_memory: true
statistics:
  confidence_level: 0.95
  ci_support: {}
profiles:
  smoke:
    warmups: 1
    repetitions: 1
    bootstrap_resamples: 0
    device: cpu
    dtype: float32
    batch_size: 1
    hardware_required: false
    devices: [cpu]
  development: &authoritative
    warmups: 1
    repetitions: 3
    bootstrap_resamples: 10000
    device: cpu
    dtype: float32
    batch_size: 1
    hardware_required: false
  validation: *authoritative
  locked: *authoritative

smoke:
  - token-256-32|sentence-transformers/all-MiniLM-L6-v2

# The standard run is intentionally the complete 8 x 7 matrix. Screening an
# embedding with only one chunker can hide chunker/model interactions.
standard:
  matrix:
    chunking:
      - recursive-character
      - token-256-32
      - token-384-64
      - token-512-64
      - sentence-8-2
      - semantic
      - section-aware-512-64
      - structure-aware-512-64
    embedding:
      - sentence-transformers/all-MiniLM-L6-v2
      - google/embeddinggemma-300m
      - infgrad/Jasper-Token-Compression-600M
      - Qwen/Qwen3-Embedding-0.6B
      - nvidia/Nemotron-3-Embed-1B-BF16
      - Qwen/Qwen3-Embedding-4B
      - nvidia/Nemotron-3-Embed-8B-BF16

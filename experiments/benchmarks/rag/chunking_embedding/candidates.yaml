smoke:
  - token-256-32|Alibaba-NLP/gte-modernbert-base

# The standard run is intentionally the complete 8 x 6 matrix. Screening an
# embedding with only one chunker can hide chunker/model interactions.
standard:
  matrix:
    chunking:
      - recursive-character
      - token-256-32
      - token-384-64
      - token-512-64
      - sentence-8-2
      - semantic
      - section-aware-512-64
      - structure-aware-512-64
    embedding:
      - Alibaba-NLP/gte-modernbert-base
      - Snowflake/snowflake-arctic-embed-m-v2.0
      - codefuse-ai/F2LLM-v2-0.6B
      - Octen/Octen-Embedding-0.6B
      - Qwen/Qwen3-Embedding-0.6B
      - nvidia/Nemotron-3-Embed-1B-BF16

schema_version: 1
protocol_version: generation-v1
seed: 42

generation:
  temperature: 0.0
  do_sample: false
  context_tokens: 8192
  maximum_answer_tokens: 256
  streamer_timeout_seconds: 600

development_screen:
  question_count: 24

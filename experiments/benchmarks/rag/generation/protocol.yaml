    repetitions: 1
    bootstrap_resamples: 0
    device: cpu
    dtype: auto
    batch_size: 1
    hardware_required: false
  development:
    warmups: 2
    repetitions: 3
    bootstrap_resamples: 10000
    device: cuda
    dtype: float16
    batch_size: 1
    hardware_required: true
  validation:
    warmups: 2
    repetitions: 3

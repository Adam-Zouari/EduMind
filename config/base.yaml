# Provisional application defaults. Experiments never modify this file automatically.
models:
  lock_path: data/benchmarks/models/selected.json

extraction:
  cache_enabled: true
  cache_directory: artifacts/extraction/cache
  maximum_upload_bytes: 104857600

embedding:
  model_name: Alibaba-NLP/gte-modernbert-base
  dimension: 768
  indexing_device: cpu
  query_device: cpu
  query_prefix: ""
  document_prefix: ""
  normalize: true
  similarity: cosine
  maximum_length: 8192
  batch_size: 32

chunking:
  strategy: token
  chunk_size: 256
  chunk_overlap: 32
  tokenizer: cl100k_base

vector:
  backend: chroma-server
  endpoint: http://127.0.0.1:8001
  collection_name: edumind
  distance_metric: cosine

retrieval:
  strategy: dense
  top_k: 5
  candidate_k: 20
  context_token_budget: 2048

generation:
  model_name: Qwen/Qwen3-1.7B
  device: cpu
  dtype: auto
  reasoning: false
  temperature: 0.0
  seed: 42
  context_tokens: 8192
  maximum_answer_tokens: 256

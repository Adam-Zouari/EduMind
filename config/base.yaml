# Provisional application defaults. Experiments never modify this file automatically.
models:
  lock_path: data/benchmarks/models/selected.json

extraction:
  cache_enabled: true
  cache_directory: artifacts/extraction/cache
  maximum_upload_bytes: 104857600
  # Provisional values; benchmark promotion is a manual edit.
  video:
    keyframe_strategy: hybrid
    fixed_interval_seconds: 10
    scene_threshold: 0.35
    maximum_hybrid_gap_seconds: 10

embedding:
  # Pooling, dimension, similarity, prefixes, and native limit come from EmbeddingSpec.
  model_name: Alibaba-NLP/gte-modernbert-base
  indexing_device: cpu
  query_device: cpu
  batch_size: 1

chunking:
  strategy: token
  chunk_size: 256
  chunk_overlap: 32
  tokenizer: cl100k_base

vector:
  backend: chroma-server
  endpoint: http://127.0.0.1:8001
  collection_name: edumind
  distance_metric: cosine

retrieval:
  strategy: dense
  top_k: 5
  candidate_k: 20
  context_token_budget: 2048

generation:
  model_name: Qwen/Qwen3-1.7B
  device: cpu
  dtype: auto
  reasoning: false
  temperature: 0.0
  do_sample: false
  seed: 42
  context_tokens: 8192
  maximum_answer_tokens: 256
  streamer_timeout_seconds: 600

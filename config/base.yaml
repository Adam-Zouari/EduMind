# Provisional application defaults. Experiments never modify this file automatically.
extraction:
  cache_enabled: true
  cache_directory: artifacts/extraction/cache
  maximum_upload_bytes: 104857600
  model_lock_path: data/benchmarks/models/extraction.json

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
  dimension: 384
  indexing_device: cpu
  query_device: cpu
  query_prefix: ""
  document_prefix: ""
  normalize: true
  similarity: cosine
  maximum_length: 256
  batch_size: 32

chunking:
  strategy: token
  chunk_size: 256
  chunk_overlap: 32
  tokenizer: embedding

vector:
  backend: chroma-server
  endpoint: http://127.0.0.1:8001
  collection_name: edumind
  distance_metric: cosine

retrieval:
  strategy: dense
  top_k: 5
  candidate_k: 20
  context_token_budget: 2048

generation:
  model_name: qwen3:1.7b
  digest: unpinned
  base_url: http://127.0.0.1:11434
  thinking: "off"
  temperature: 0.0
  seed: 42
  context_tokens: 8192
  maximum_answer_tokens: 256
  timeout_seconds: 120
  keep_alive: 5m
  model_lock_path: data/benchmarks/models/ollama.json

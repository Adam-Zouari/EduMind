[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edumind-ai"
version = "0.1.0"
description = "Local-first, benchmark-driven multimodal extraction and RAG system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "EduMind-AI Maintainers" }]
dependencies = [
  "numpy",
  "pyyaml",
  "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["edumind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
# Invalid serialized protocols and artifacts are validation failures even when
# the offending JSON value has the wrong Python type.
ignore = ["TRY004"]

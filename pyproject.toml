[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edumind-ai"
version = "0.1.0"
description = "Local-first, benchmark-driven multimodal extraction and RAG system."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "EduMind-AI Maintainers" }]
dependencies = [
  "loguru>=0.7.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
extraction = [
  "ffmpeg-python>=0.2.0",
  "ftfy>=6.2.0",
  "opencv-python>=4.9.0.80",
  "paddleocr>=2.7.0.3",
  "paddlepaddle>=2.6.0",
  "pdfplumber>=0.10.0",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0",
  "PyMuPDF>=1.23.0",
  "pytesseract>=0.3.10",
  "python-docx>=1.1.0",
  "unidecode>=1.3.8",
]
asr = [
  "faster-whisper>=1.1.0",
  "openai-whisper>=20250625",
]
rag = [
  "chromadb>=0.4.22",
  "rank_bm25>=0.2.2",
  "scikit-learn>=1.4.0",
  "sentence-transformers>=2.7.0",
  "tiktoken>=0.5.2",
  "torch>=2.0.0",
]
ui = [
  "streamlit>=1.28.0",
]
api = [
  "fastapi>=0.104.0",
  "python-multipart>=0.0.6",
  "uvicorn[standard]>=0.24.0",
]
benchmarks = [
  "chromadb>=0.4.22",
  "datasets>=3.0.0",
  "docling>=2.0.0",
  "huggingface-hub>=0.27.0",
  "python-doctr>=0.9.0",
  "lancedb>=0.9.0",
  "mammoth>=1.8.0",
  "matplotlib>=3.8.0",
  "mlflow>=2.14.0",
  "nvidia-ml-py>=12.0.0",
  "psutil>=6.0.0",
  "qdrant-client>=1.11.0",
  "rank_bm25>=0.2.2",
  "scikit-learn>=1.4.0",
  "seaborn>=0.13.0",
  "sentence-transformers>=2.7.0",
  "unstructured>=0.16.0",
]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
edumind = "edumind.cli:main"
edumind-ui = "edumind.cli:run_ui"
edumind-extraction-api = "edumind.cli:run_extraction_api"
edumind-rag-api = "edumind.cli:run_rag_api"
edumind-benchmark = "edumind.benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edumind*"]

[tool.setuptools.package-data]
edumind = ["defaults.yaml", "recommendations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edumind-ai"
version = "0.1.0"
description = "Portfolio-grade OCR, RAG, and MLflow experimentation monorepo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EduMind-AI Maintainers" }]
dependencies = [
  "loguru>=0.7.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
ocr = [
  "beautifulsoup4>=4.12.0",
  "ffmpeg-python>=0.2.0",
  "ftfy>=6.2.0",
  "lxml>=5.0.0",
  "lxml_html_clean>=0.1.1",
  "newspaper3k>=0.2.8",
  "opencv-python>=4.9.0.80",
  "openai-whisper>=20231117",
  "paddleocr>=2.7.0.3",
  "paddlepaddle>=2.6.0",
  "pdfplumber>=0.10.0",
  "Pillow>=10.0.0",
  "PyMuPDF>=1.23.0",
  "pytesseract>=0.3.10",
  "python-docx>=1.1.0",
  "python-magic>=0.4.27",
  "regex>=2023.12.25",
  "tika>=2.6.0",
  "trafilatura>=1.8.0",
  "unidecode>=1.3.8",
]
rag = [
  "chromadb>=0.4.22",
  "mlflow>=2.14.0",
  "rank_bm25>=0.2.2",
  "scikit-learn>=1.4.0",
  "sentence-transformers>=2.7.0",
  "tiktoken>=0.5.2",
  "torch>=2.0.0",
  "unstructured>=0.11.8",
]
ui = [
  "streamlit>=1.28.0",
]
api = [
  "fastapi>=0.104.0",
  "python-multipart>=0.0.6",
  "uvicorn[standard]>=0.24.0",
]
experiments = [
  "matplotlib>=3.8.0",
  "mlflow>=2.14.0",
  "pynvml>=11.5.0",
  "scikit-learn>=1.4.0",
  "seaborn>=0.13.0",
  "sentence-transformers>=2.7.0",
]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
edumind = "edumind.cli:main"
edumind-ui = "edumind.cli:run_ui"
edumind-ocr-api = "edumind.cli:run_ocr_api"
edumind-rag-api = "edumind.cli:run_rag_api"
edumind-experiments = "edumind.cli:run_experiments"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edumind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
